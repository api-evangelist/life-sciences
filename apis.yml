      https://www.ema.europa.eu/en/human-regulatory-overview/research-development/clinical-trials-human-medicines/clinical-trials-information-system
    title: EMA CTIS overview
  - type: HumanInterface
    url: https://www.clinicaltrialsregister.eu/
    title: Legacy EU Clinical Trials Register
- name: openFDA
  description: >-

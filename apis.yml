    resolution, NDC lookup, relationship traversal, interaction discovery via RxNav, and approximate matching.
  humanURL: https://lhncbc.nlm.nih.gov/RxNav/APIs/RxNormAPIs.html
  baseURL: https://rxnav.nlm.nih.gov/REST/

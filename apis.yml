- name: HL7 FHIR
  description: >-
    Fast Healthcare Interoperability Resources (FHIR) is HL7's standard for health care data exchange.
    The current normative version is R5, released March 2023. Defines roughly 150 resource types covering
    administration, clinical care, diagnostics, medications, workflow, financial, and foundation domains,
    exchanged over REST, messaging, or document paradigms.
  humanURL: https://www.hl7.org/fhir/
  baseURL: https://hl7.org/fhir/R5/
  tags:

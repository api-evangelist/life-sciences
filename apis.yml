description: >-
  Industry-vertical index for the life sciences, biotechnology, and
  pharmaceutical landscape. Catalogs the major public and commercial APIs
  spanning clinical trial registries, drug and regulatory data, genomic
  reference data, electronic health record exchange, laboratory informatics
  systems, and bioinformatics pipeline platforms. The catalog is anchored by
  shared schemas for the three core records that recur across this domain:
  the clinical trial, the drug, and the gene.

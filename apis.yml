apis:
- name: EU Clinical Trials Register / CTIS
  description: >-
    The European Medicines Agency's Clinical Trials Information System (CTIS) and the legacy EU Clinical
    Trials Register. CTIS is the single entry point for sponsors and regulators across the EU/EEA to submit
    and supervise clinical trials under Regulation (EU) No 536/2014. Public lookup is offered through
    a web portal; bulk and integration interfaces are not openly published as REST APIs.
  humanURL: https://euclinicaltrials.eu/
  baseURL: https://euclinicaltrials.eu/ctis-public/
  tags:
  - Clinical Trials
  - EU
  - EMA
  - Regulator
  - CTIS
